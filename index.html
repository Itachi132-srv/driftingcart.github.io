<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Kart Parkour</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #00f3ff;
        }
        canvas {
            display: block;
            background: #08081a;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #00f3ff;
            pointer-events: none;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        h1 {
            font-size: 42px;
            color: #ff0055;
            text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055;
        }
        p {
            font-size: 18px;
            color: #00f3ff;
        }
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #050510;
            background: #00f3ff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #00f3ff;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #00f3ff;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="ui">
            <div id="score">SCORE: 0</div>
            <div id="speed">SPEED: 100 MPH</div>
        </div>
        <div id="game-over-screen">
            <h1>NEON CRASH!</h1>
            <p id="final-score">Final Score: 0</p>
            <button onclick="resetGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over-screen');

        // Game State
        let isGameOver = false;
        let score = 0;
        let speed = 8;
        let distance = 0;

        // Player Kart
        const kart = {
            x: canvas.width / 2,
            y: 380,
            width: 40,
            height: 60,
            xVelocity: 0,
            yOffset: 0, // Vertical offset for jumping
            yVelocity: 0,
            isJumping: false,
            gravity: 0.8,
            jumpStrength: -14
        };

        // Inputs
        const keys = {
            Left: false,
            Right: false,
            Jump: false
        };

        // Track & Obstacles
        const trackLanes = [260, 350, 440, 530]; // Lane X positions
        let obstacles = [];
        let particles = [];

        // Controls Listener
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
                if (!keys.Jump && !kart.isJumping && !isGameOver) {
                    kart.yVelocity = kart.jumpStrength;
                    kart.isJumping = true;
                }
                keys.Jump = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') keys.Jump = false;
        });

        // Spawn Obstacles & Gaps
        function spawnObstacle() {
            const laneIndex = Math.floor(Math.random() * 3);
            const laneX = trackLanes[laneIndex];
            const type = Math.random() > 0.4 ? 'barrier' : 'ramp'; // Ramp or Barrier

            obstacles.push({
                x: laneX,
                y: -100,
                width: 70,
                height: type === 'ramp' ? 40 : 30,
                type: type,
                passed: false
            });
        }

        // Particle System for Sparks
        function createSparks(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 20,
                    color: color
                });
            }
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            speed = 8;
            distance = 0;
            obstacles = [];
            particles = [];
            kart.x = canvas.width / 2;
            kart.yOffset = 0;
            kart.isJumping = false;
            gameOverScreen.classList.add('hidden');
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (isGameOver) return;

            // Update Score & Speed
            distance += speed;
            score = Math.floor(distance / 10);
            scoreEl.innerText = `SCORE: ${score}`;
            if (speed < 18) speed += 0.001; // Gradually increase difficulty

            // Player Steering
            if (keys.Left) kart.xVelocity = -7;
            else if (keys.Right) kart.xVelocity = 7;
            else kart.xVelocity *= 0.8;

            kart.x += kart.xVelocity;

            // Track Boundaries
            if (kart.x < 220) kart.x = 220;
            if (kart.x > 580) kart.x = 580;

            // Player Jump Physics
            if (kart.isJumping) {
                kart.yOffset += kart.yVelocity;
                kart.yVelocity += kart.gravity;

                if (kart.yOffset >= 0) {
                    kart.yOffset = 0;
                    kart.isJumping = false;
                    createSparks(kart.x, kart.y + 30, '#00f3ff');
                }
            }

            // Spawn Logic
            if (Math.random() < 0.025) {
                const lastObs = obstacles[obstacles.length - 1];
                if (!lastObs || lastObs.y > 150) {
                    spawnObstacle();
                }
            }

            // Move Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += speed;

                // Collision Detection
                const kartBox = {
                    left: kart.x - kart.width / 2,
                    right: kart.x + kart.width / 2,
                    top: kart.y - kart.height / 2 + kart.yOffset,
                    bottom: kart.y + kart.height / 2 + kart.yOffset
                };

                const obsBox = {
                    left: obs.x,
                    right: obs.x + obs.width,
                    top: obs.y,
                    bottom: obs.y + obs.height
                };

                // Check overlap
                if (kartBox.right > obsBox.left &&
                    kartBox.left < obsBox.right &&
                    kartBox.bottom > obsBox.top &&
                    kartBox.top < obsBox.bottom) {

                    if (obs.type === 'barrier') {
                        // Must jump higher than obstacle height to clear
                        if (kart.yOffset > -20) {
                            endGame();
                        }
                    } else if (obs.type === 'ramp') {
                        // Hit a ramp! Launch into parkour air time
                        kart.yVelocity = -16;
                        kart.isJumping = true;
                        createSparks(kart.x, kart.y, '#ff0055');
                        obstacles.splice(i, 1);
                        continue;
                    }
                }

                // Remove off-screen obstacles
                if (obs.y > canvas.height + 50) {
                    obstacles.splice(i, 1);
                }
            }

            // Particles Update
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function endGame() {
            isGameOver = true;
            finalScoreEl.innerText = `Final Score: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        function draw() {
            // Clear Background
            ctx.fillStyle = '#08081a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Perspective Highway / Track
            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00f3ff';

            // Track Edges
            ctx.beginPath();
            ctx.moveTo(200, 0); ctx.lineTo(200, canvas.height);
            ctx.moveTo(600, 0); ctx.lineTo(600, canvas.height);
            ctx.stroke();

            // Moving Grid Lines (3D horizon feel)
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
            const gridOffset = (distance % 40);
            for (let y = gridOffset; y < canvas.height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(200, y);
                ctx.lineTo(600, y);
                ctx.stroke();
            }

            // Draw Obstacles
            obstacles.forEach(obs => {
                if (obs.type === 'barrier') {
                    ctx.fillStyle = '#ff0055';
                    ctx.shadowColor = '#ff0055';
                    ctx.shadowBlur = 12;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                } else if (obs.type === 'ramp') {
                    ctx.fillStyle = '#ffcc00';
                    ctx.shadowColor = '#ffcc00';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.height);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.closePath();
                    ctx.fill();
                }
            });

            // Draw Neon Kart
            ctx.save();
            ctx.translate(kart.x, kart.y + kart.yOffset);

            // Kart Shadow (when jumping)
            if (kart.isJumping) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(0, -kart.yOffset, 20, 10, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Kart Glow & Body
            ctx.fillStyle = '#00f3ff';
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 20;
            ctx.fillRect(-kart.width / 2, -kart.height / 2, kart.width, kart.height);

            // Inner Neon Core
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-kart.width / 4, -kart.height / 4, kart.width / 2, kart.height / 2);

            // Trail Sparks
            ctx.fillStyle = '#ff0055';
            ctx.fillRect(-12, kart.height / 2, 8, 10 + Math.random() * 10);
            ctx.fillRect(4, kart.height / 2, 8, 10 + Math.random() * 10);

            ctx.restore();

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8;
                ctx.fillRect(p.x, p.y, 4, 4);
            });
        }

        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Start initial state
        resetGame();
    </script>
</body>
</html>
