<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRIFT TRACKS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05070c;color:white;font-family:Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100dvh}
#hud{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none}
.logo{font-size:26px;font-weight:900;letter-spacing:2px;color:#fff}
.logo span{color:#00ffcc}
.stats{display:flex;gap:10px}
.stat{background:#0d1322;padding:10px 15px;border-radius:10px;border:1px solid #ffffff22;min-width:110px;text-align:center}
.label{font-size:9px;color:#89a2bc;letter-spacing:1px;margin-bottom:2px}
.value{font-size:20px;font-weight:bold}
#score{color:#ffe600}
#combo{color:#ff0055}
#speed{color:#00ffcc}
#menu{position:absolute;inset:0;background:#05070cf0;display:flex;align-items:center;justify-content:center;padding:20px}
.panel{width:420px;max-width:100%;text-align:center;background:#0d1322;border:1px solid #ffffff33;border-radius:20px;padding:30px}
h1{font-size:48px;line-height:1;margin:10px 0 20px}
h1 span{color:#00ffcc}
p{color:#89a2bc;font-size:13px;line-height:1.5;margin-bottom:20px}
button{cursor:pointer;border:0;border-radius:10px;padding:14px;font-weight:bold;font-size:14px}
.start{width:100%;background:#00ffcc;color:#05070c;margin-top:10px}
#controls{position:absolute;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;pointer-events:none}
.group{display:flex;gap:10px;pointer-events:auto}
.control{width:70px;height:70px;background:#0d1322cc;color:white;border:1px solid #ffffff44;font-size:24px;border-radius:14px;touch-action:none}
.gas{color:#00ffcc;border-color:#00ffcc}
.brake{color:#ff0055;border-color:#ff0055}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="logo">DRIFT<span>TRACKS</span></div>
 <div class="stats">
  <div class="stat"><div class="label">DRIFT COMBO</div><div class="value" id="combo">1.0x</div></div>
  <div class="stat"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
  <div class="stat"><div class="label">SPEED</div><div class="value" id="speed">0</div></div>
 </div>
</div>

<div id="menu">
 <div class="panel">
  <h1>PRO DRIFT<br><span>TRACK</span></h1>
  <p>Hit the apex, slide through sharp corners, and chain huge drift combos!</p>
  <button class="start" id="start">START ENGINE ▶</button>
  <p style="margin-top:15px;font-size:11px;">Controls: WASD / Arrow Keys or On-Screen Buttons</p>
 </div>
</div>

<div id="controls">
 <div class="group">
  <button class="control" data-key="left">◀</button>
  <button class="control" data-key="right">▶</button>
 </div>
 <div class="group">
  <button class="control brake" data-key="brake">▼</button>
  <button class="control gas" data-key="gas">▲</button>
 </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
}
addEventListener('resize', resize);
resize();

let running = false;
let score = 0, combo = 1, speed = 0;
let particles = [];

// Car physics state
const car = {
    x: 0, y: 0,
    angle: 0,
    vx: 0, vy: 0,
    speed: 0,
    maxSpeed: 14,
    accel: 0.15,
    friction: 0.98,
    steerSpeed: 0.05,
    driftFactor: 0.92
};

const keys = { left: false, right: false, gas: false, brake: false };

// Track Layout
const trackPoints = [
    {x: 400, y: 300},
    {x: 1000, y: 200},
    {x: 1500, y: 600},
    {x: 1200, y: 1100},
    {x: 600, y: 1200},
    {x: 200, y: 800}
];

document.getElementById('start').onclick = () => {
    running = true;
    document.getElementById('menu').style.display = 'none';
    car.x = trackPoints[0].x;
    car.y = trackPoints[0].y;
    car.angle = 0;
    car.speed = 0;
    score = 0;
};

// Controls setup
document.querySelectorAll('[data-key]').forEach(b => {
    const k = b.dataset.key;
    const on = e => { e.preventDefault(); keys[k] = true; };
    const off = e => { e.preventDefault(); keys[k] = false; };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
});

addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.left = true;
    if (k === 'arrowright' || k === 'd') keys.right = true;
    if (k === 'arrowup' || k === 'w') keys.gas = true;
    if (k === 'arrowdown' || k === 's') keys.brake = true;
});

addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') keys.left = false;
    if (k === 'arrowright' || k === 'd') keys.right = false;
    if (k === 'arrowup' || k === 'w') keys.gas = false;
    if (k === 'arrowdown' || k === 's') keys.brake = false;
});

function update() {
    if (!running) return;

    if (keys.gas) car.speed = Math.min(car.maxSpeed, car.speed + car.accel);
    if (keys.brake) car.speed = Math.max(-4, car.speed - car.accel * 1.5);
    
    car.speed *= car.friction;

    let steerIntensity = 0;
    if (keys.left) steerIntensity = -1;
    if (keys.right) steerIntensity = 1;

    if (Math.abs(car.speed) > 0.5) {
        car.angle += steerIntensity * car.steerSpeed * (car.speed / car.maxSpeed);
    }

    const forwardX = Math.cos(car.angle);
    const forwardY = Math.sin(car.angle);

    let targetVx = forwardX * car.speed;
    let targetVy = forwardY * car.speed;

    car.vx = car.vx * car.driftFactor + targetVx * (1 - car.driftFactor);
    car.vy = car.vy * car.driftFactor + targetVy * (1 - car.driftFactor);

    car.x += car.vx;
    car.y += car.vy;

    let movementAngle = Math.atan2(car.vy, car.vx);
    let driftAngle = Math.abs(car.angle - movementAngle);
    while (driftAngle > Math.PI) driftAngle -= Math.PI * 2;
    driftAngle = Math.abs(driftAngle);

    let currentSpeedMag = Math.hypot(car.vx, car.vy);
    if (driftAngle > 0.3 && currentSpeedMag > 4) {
        let driftValue = Math.floor(currentSpeedMag * driftAngle * 10);
        combo = +(1 + driftAngle * 2).toFixed(1);
        score += Math.floor(driftValue * combo);

        if (Math.random() < 0.6) {
            particles.push({
                x: car.x - forwardX * 15 + (Math.random() - 0.5) * 10,
                y: car.y - forwardY * 15 + (Math.random() - 0.5) * 10,
                alpha: 0.5,
                size: 8 + Math.random() * 8
            });
        }
    } else {
        combo = 1.0;
    }

    document.getElementById('score').textContent = score;
    document.getElementById('combo').textContent = combo + 'x';
    document.getElementById('speed').textContent = Math.round(currentSpeedMag * 12);
}

function drawTrack() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 180;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.beginPath();
    ctx.moveTo(trackPoints[0].x, trackPoints[0].y);
    for (let i = 1; i < trackPoints.length; i++) {
        ctx.lineTo(trackPoints[i].x, trackPoints[i].y);
    }
    ctx.closePath();
    ctx.stroke();

    ctx.strokeStyle = '#ff005522';
    ctx.lineWidth = 190;
    ctx.stroke();
}

function draw() {
    ctx.save();
    let camX = W / 2 - car.x;
    let camY = H / 2 - car.y;
    ctx.translate(camX, camY);

    drawTrack();

    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        ctx.fillStyle = `rgba(200, 200, 200, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        p.alpha -= 0.02;
        p.size += 0.3;
        if (p.alpha <= 0) particles.splice(i, 1);
    }

    ctx.save();
    ctx.translate(car.x, car.y);
    ctx.rotate(car.angle);

    // Car Shadow
    ctx.fillStyle = '#0008';
    ctx.fillRect(-22, -12, 44, 24);

    // Tires
    ctx.fillStyle = '#111';
    ctx.fillRect(-18, -16, 10, 6);
    ctx.fillRect(8, -16, 10, 6);
    ctx.fillRect(-18, 10, 10, 6);
    ctx.fillRect(8, 10, 10, 6);

    // Body
    ctx.fillStyle = '#00ffcc';
    ctx.beginPath();
    ctx.roundRect(-20, -12, 40, 24, 6);
    ctx.fill();

    // Windshield
    ctx.fillStyle = '#0a0f1d';
    ctx.fillRect(-2, -10, 12, 20);

    ctx.restore();
    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
